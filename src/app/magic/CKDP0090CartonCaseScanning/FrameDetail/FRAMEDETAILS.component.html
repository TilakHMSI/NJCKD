<div novalidate [formGroup]="screenFormGroup">

    <div class="container-fluid-ov" [magic]="mgc.FRAMEDETAILS">
        <div class="card">
            <div class="card-header">
                <div class="d-flex justify-content-between align-items-center w-100">
                    <h3><label class="lbl-sm" class="lable_overflow mb-0">
                            Frame Details
                        </label></h3>
                    <button type="button" [magic]="mgc.btnexit"
                        class="btn btn-danger btn-sm font-weight-bold ml-2">Back</button>
                </div>
            </div>
        </div>

        <div class="col-lg-6">
            <div class="form-group-sm">
                <label>Frame No</label>
                <input class="form-control-ent" type="text" [formControlName]="mgc.vFrameNo" [magic]="mgc.vFrameNo" 
                    mgFormat />
            </div>
        </div>

      <div class="col-lg-12">
            <magic-subform [magic]="mgc.Sub1">
            </magic-subform>
        </div>
    </div>
</div>
